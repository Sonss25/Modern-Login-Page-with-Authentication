<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Axion — Sign in</title>
<meta name="description" content="Sign in to your Axion account." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="orb orb--a" aria-hidden="true"></div>
  <div class="orb orb--b" aria-hidden="true"></div>
  <div class="orb orb--c" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="auth-shell">
    <div class="auth-card page-enter" id="card">

      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <defs>
              <linearGradient id="lg1" x1="0" y1="0" x2="48" y2="48">
                <stop offset="0" stop-color="#5b7cff"/>
                <stop offset="1" stop-color="#9d6bff"/>
              </linearGradient>
            </defs>
            <circle class="ring" cx="24" cy="24" r="20" stroke="url(#lg1)" stroke-width="1.4" stroke-dasharray="6 7" opacity="0.6"/>
            <path d="M24 10 L36 31 H12 Z" fill="url(#lg1)" opacity="0.9"/>
            <circle cx="24" cy="24" r="3.4" fill="#eef0f8"/>
          </svg>
        </div>
        <p class="brand-name">Axion</p>
      </div>

      <section class="view" id="view-login">
        <div class="view-head">
          <h1>Welcome back</h1>
          <p>Sign in to continue to your account.</p>
        </div>

        <div class="form-banner" id="login-banner" role="alert">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm.75-11a.75.75 0 00-1.5 0v4a.75.75 0 001.5 0V7zm-.75 6.5a.9.9 0 100 1.8.9.9 0 000-1.8z" clip-rule="evenodd"/></svg>
          <span>Unable to sign in. Please check your credentials and try again.</span>
        </div>

        <form id="login-form" novalidate>
          <div class="field" data-field="email">
            <div class="field-shell">
              <span class="field-icon" aria-hidden="true">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5.5h14a1 1 0 011 1v7a1 1 0 01-1 1H3a1 1 0 01-1-1v-7a1 1 0 011-1z"/><path d="M2.4 6l7.6 5.5L17.6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              <input class="field-input" type="email" id="login-email" name="email" placeholder=" " autocomplete="email" required aria-describedby="login-email-err" />
              <label class="field-label" for="login-email">Email address</label>
              <span class="field-status" aria-hidden="true">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10.5l4 4 8-9" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
            </div>
            <span class="field-error" id="login-email-err" role="alert">Please enter a valid email address.</span>
          </div>

          <div class="field" data-field="password">
            <div class="field-shell">
              <span class="field-icon" aria-hidden="true">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="9" width="12" height="8" rx="1.6"/><path d="M6.5 9V6.5a3.5 3.5 0 017 0V9" stroke-linecap="round"/></svg>
              </span>
              <input class="field-input" type="password" id="login-password" name="password" placeholder=" " autocomplete="current-password" required aria-describedby="login-password-err" />
              <label class="field-label" for="login-password">Password</label>
              <button class="field-action" type="button" data-toggle-pass="login-password" aria-label="Show password" aria-pressed="false">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 10S4.5 4.5 10 4.5 18.5 10 18.5 10 15.5 15.5 10 15.5 1.5 10 1.5 10z"/><circle cx="10" cy="10" r="2.4"/></svg>
              </button>
            </div>
            <span class="field-error" id="login-password-err" role="alert">Please enter your password.</span>
          </div>

          <div class="row-between">
            <label class="checkbox">
              <input type="checkbox" id="login-remember" name="remember" />
              <span class="checkbox-box" aria-hidden="true">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 6l2.5 2.5L10 3" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              Remember me
            </label>
            <a href="forgot-password.html" class="link" data-transition>Forgot password?</a>
          </div>

          <button class="btn" type="submit" id="login-submit">
            <span class="btn-label">Sign in</span>
            <span class="spinner" aria-hidden="true"></span>
            <svg class="check-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M4 10.5l4 4 8-9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>

        <div class="divider">or continue with</div>
        <div class="social-row">
          <button class="social-btn" type="button" aria-label="Continue with Google">
            <svg viewBox="0 0 20 20"><path fill="#EA4335" d="M10 8.18v3.9h5.44c-.24 1.3-1.7 3.8-5.44 3.8-3.28 0-5.95-2.7-5.95-6s2.67-6 5.95-6c1.87 0 3.12.8 3.84 1.48l2.62-2.53C14.9.98 12.68 0 10 0 4.48 0 0 4.48 0 10s4.48 10 10 10c5.77 0 9.6-4.06 9.6-9.78 0-.66-.07-1.16-.16-1.66H10z"/></svg>
          </button>
          <button class="social-btn" type="button" aria-label="Continue with Apple">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M13.9 3.6c.8-1 1.3-2.3 1.2-3.6-1.1.05-2.5.75-3.3 1.7-.7.8-1.4 2.1-1.2 3.4 1.3.1 2.5-.6 3.3-1.5zM17 14.2c-.5 1.1-.7 1.6-1.3 2.6-.9 1.4-2.1 3.1-3.7 3.1-1.4 0-1.8-.9-3.6-.9-1.8 0-2.3.9-3.6.9-1.6 0-2.7-1.5-3.6-2.9C-.6 14.1-1 8.7 1.6 5.9c1.3-1.4 2.9-2.2 4.4-2.2 1.4 0 2.4.9 3.6.9 1.2 0 1.9-.9 3.6-.9 1.3 0 2.7.7 3.7 1.9-3.2 1.8-2.7 6.3.1 8.6z"/></svg>
          </button>
          <button class="social-btn" type="button" aria-label="Continue with GitHub">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 0a10 10 0 00-3.16 19.5c.5.1.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.46-1.15-1.11-1.46-1.11-1.46-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33-2.22-.25-4.56-1.11-4.56-4.94 0-1.1.39-1.99 1.03-2.69-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.6 9.6 0 015 0c1.9-1.3 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.6 1.03 2.69 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.75c0 .26.18.58.69.48A10 10 0 0010 0z" clip-rule="evenodd"/></svg>
          </button>
        </div>

        <p class="view-foot">Don't have an account? <a href="register.html" class="link link--accent" data-transition>Create account</a></p>
      </section>

    </div>
  </main>

  <script src="js/background.js"></script>
  <script src="js/auth-service.js"></script>
  <script src="js/ui-helpers.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
